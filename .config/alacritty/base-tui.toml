[window]
padding.x = 10
padding.y = 10
opacity = 0.8


[font]
normal.family = "IosevkaTermNerdFont"
normal.style = "Medium"

bold.family = "IosevkaTermNerdFont"
bold.style = "Bold"

italic.family = "IosevkaTermNerdFont"

italic.style = "italic"

bold_italic.family = "IosevkaTermNerdFont"
bold_italic.style = "Bold Italic"

size = 10


[cursor]
style.shape = "Beam"
style.blinking = "On"

blink_interval = 500
thickness = 0.2

[[keyboard.bindings]]
key = "Space"
mods = "Control|Shift"
chars = "\u001b[32;6u"
