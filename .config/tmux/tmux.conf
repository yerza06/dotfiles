set-option -g prefix C-q
set -g mouse on

#set -g default-terminal "tmux-256color"
#set -ga terminal-overrides ",*256col*:Tc"

set -g default-terminal "${TERM}" 
set -ga terminal-overrides ",*:RGB"

set -g base-index 1
set -g history-limit 10000
setw -g pane-base-index 1

unbind %
bind -n C-M-'=' splitw -h
unbind '"'
bind -n C-M-'-' splitw -v

bind - splitw -v
bind = splitw -h

unbind c
bind -n M-Enter new-window
bind x kill-pane
bind X kill-window

bind-key S command-prompt "new-session -s '%%'"
bind-key R command-prompt "rename-session '%%'"

bind -n C-M-n next-window
bind -n C-M-p previous-window
bind M attach-session -t . -c "#{pane_current_path}"


unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind d
bind q detach
bind e display-panes

bind -n C-M-1 select-window -t 1
bind -n C-M-2 select-window -t 2
bind -n C-M-3 select-window -t 3
bind -n C-M-4 select-window -t 4
bind -n C-M-5 select-window -t 5
bind -n C-M-6 select-window -t 6
bind -n C-M-7 select-window -t 7
bind -n C-M-8 select-window -t 8
bind -n C-M-9 select-window -t 9

bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R
bind -n C-M-h select-pane -L

bind -n M-J resize-pane -D 1
bind -n M-K resize-pane -U 1
bind -n M-L resize-pane -R 1
bind -n M-H resize-pane -L 1

bind -r C-k swap-pane -U
bind -r C-j swap-pane -D

bind -r C-h swap-window -t -1\; select-window -t -1
bind -r C-l swap-window -t +1\; select-window -t +1

#unbind C-M-"m"
bind m resize-pane -Z

bind B display-popup -w 80% -h 80% -E "btop"
bind H display-popup -w 80% -h 80% -E "htop"
bind G display-popup -w 80% -h 80% -E "lazygit"
bind D display-popup -w 80% -h 80% -E "lazydocker"
bind Y display-popup -w 80% -h 80% -E "spf"

unbind v
bind v copy-mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

source-file ~/.config/tmux/core/status_bar.conf
source-file ~/.config/tmux/core/plugins.conf


# tmux-fzf (переменные окружения, а не @-опции — так задумано плагином)
TMUX_FZF_LAUNCH_KEY="f"             # prefix + f (вместо дефолтного Shift+F; find-window заменяется поиском окон в fzf)
TMUX_FZF_OPTIONS="-p -w 70% -h 60% -m"   # попап 70%x60%, мультивыбор через Tab
TMUX_FZF_ORDER="session|window|pane|command|keybinding|clipboard"   # process убран из списка
# Показывать запущенную программу и имя окна в списке панелей
TMUX_FZF_PANE_FORMAT="[#{window_name}] #{pane_current_command}  [#{pane_width}x#{pane_height}] #{?pane_active,[active],[inactive]}"

bind-key s run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh"
bind-key S run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh new"
bind-key -n M-s run-shell -b '~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch'
bind-key -n M-S run-shell -b '~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
