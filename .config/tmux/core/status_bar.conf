# ./core/status_bar.conf

# Status bar
set -g status-style bg="color0",fg="color15"
set -g status-right "#[bg=color0,fg=color3] #[bg=color3,fg=color0] %Y-%m-%d  %H:%M  #{battery_icon_status} #{battery_percentage} "
set -g status-interval 10
set -g status-right-length 70
#set -g status-left "#[bg=color2,fg=color0]  #S |  #{session_path} #[bg=color0,fg=color2]"
set -g status-left "#[bg=color2,fg=color0]  #S |  #{b:session_path} #[bg=color0,fg=color2]"
set -g status-left-length 70

# Window buttons
set -g renumber-windows on
set -g window-status-format "#[bg=color0,fg=color6]#[bg=color6,fg=color0] #I:#P  #W #[bg=color0,fg=color6]"
set -g window-status-current-format "#[bg=color0,fg=color14,width=900]#[bg=color14,fg=color0 bold] #I:#P  #W #[bg=color0,fg=color14]"

set -g status-justify left


# Pane separators
set -g pane-border-style fg=color8
set -g pane-border-lines double
set -g pane-active-border-style fg=color7
